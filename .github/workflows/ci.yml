# Weryfikacja wdrożenia jak na Render.com: testy na PostgreSQL, obraz Docker, test dymny z restartem.
name: CI — PostgreSQL i Docker

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  ASOLAR_SECRET: ci-only-secret-0123456789abcdef
  ASOLAR_MANAGER_PASSWORD: Asolar2026!
  ASOLAR_FOREMAN1_PASSWORD: Brygada1-2026!
  ASOLAR_FOREMAN2_PASSWORD: Brygada2-2026!

jobs:
  backend-postgres:
    name: Backend na PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asolar
          POSTGRES_PASSWORD: asolar
          POSTGRES_DB: asolar
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://asolar:asolar@localhost:5432/asolar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend (React, PWA, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  docker-render:
    name: Obraz Docker jak na Render + test dymny
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asolar
          POSTGRES_PASSWORD: asolar
          POSTGRES_DB: render
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Budowanie obrazu (Dockerfile z repozytorium)
        run: docker build -t asolar:ci .
      - name: Serwer bez ASOLAR_SECRET nie może wystartować na PostgreSQL
        run: |
          if docker run --rm --network host -e DATABASE_URL=postgres://asolar:asolar@localhost:5432/render -e PORT=10001 asolar:ci timeout 20 python server.py; then
            echo "BŁĄD: serwer wystartował bez sekretów"; exit 1
          fi
      - name: Start kontenera (adres postgres:// jak na Render, PORT=10000)
        run: |
          docker run -d --name asolar --network host \
            -e DATABASE_URL=postgres://asolar:asolar@localhost:5432/render -e PORT=10000 -e ASOLAR_HOST=0.0.0.0 \
            -e ASOLAR_SECRET -e ASOLAR_MANAGER_PASSWORD -e ASOLAR_FOREMAN1_PASSWORD -e ASOLAR_FOREMAN2_PASSWORD \
            asolar:ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "websockets>=12,<16"
      - name: Test dymny — kierownik, brygadziści, WebSocket, zdjęcia
        run: python scripts/smoke_test.py http://localhost:10000 setup
      - name: Restart kontenera — dane i hasła muszą przetrwać
        run: |
          docker restart asolar
          python scripts/smoke_test.py http://localhost:10000 verify
      - name: Dziennik serwera
        if: always()
        run: docker logs asolar 2>&1 | tail -80
