# Buduje aplikację desktopową ASOLAR v2 (.exe) i publikuje ją jako wydanie wstępne (pre-release),
# żeby nie zastąpić „najnowszego” wydania v1. Uruchomienie: tag v2.* (np. v2.0.0) albo ręcznie.
name: Windows — instalator ASOLAR v2

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testy backendu v2
        working-directory: v2/backend
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Frontend v2 — testy i build
        working-directory: v2/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Aplikacja desktopowa v2 — testy i build .exe
        working-directory: v2/desktop
        run: |
          npm ci
          npm test
          npx electron-builder --win nsis portable --publish never
      - name: Artefakt przebiegu
        uses: actions/upload-artifact@v4
        with:
          name: ASOLAR-v2-windows
          path: v2/desktop/dist/*.exe
          retention-days: 14
      - name: Wydanie wstępne na GitHub
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="ASOLAR v2 (wiele budów) ${tag} — wydanie wstępne, niezależne od ASOLAR v1.

          - ASOLAR-v2-*-instalator.exe — instalator
          - ASOLAR-v2-*-portable.exe — wersja przenośna

          Tryby: klient serwera v2 w chmurze (adres HTTPS) albo serwer na tym komputerze (wymaga Pythona 3.11, py -3.11).
          Pierwsze logowanie w trybie lokalnym: kierownik / Asolar2026! — zmień hasło w zakładce Konta.
          Pliki nie są podpisane cyfrowo — SmartScreen może pokazać ostrzeżenie (Więcej informacji → Uruchom mimo to)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" v2/desktop/dist/*.exe --clobber
          else
            gh release create "$tag" v2/desktop/dist/*.exe --prerelease --title "ASOLAR v2 ${tag#v}" --notes "$notes"
          fi
