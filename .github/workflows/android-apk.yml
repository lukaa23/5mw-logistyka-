name: Android APK

# Ręczne uruchomienie: GitHub → Actions → „Android APK” → Run workflow.
# Wynik (app-debug.apk) pobierzesz z sekcji Artifacts na stronie przebiegu.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Testy ekranu połączenia
        working-directory: android-app
        run: |
          npm install
          npm test

      - name: Dodaj platformę Android
        working-directory: android-app
        run: npx cap add android

      - name: Uprawnienie do aparatu (zdjęcia z telefonu)
        working-directory: android-app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          grep -n 'permission' "$MANIFEST"

      - name: Synchronizacja i budowa APK
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: asolar-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
