# Buduje aplikację desktopową ASOLAR (.exe) na Windows i publikuje ją jako GitHub Release.
# Uruchomienie: wypchnięcie tagu v* (np. v4.6.0) albo ręcznie w zakładce Actions.
name: Windows — instalator ASOLAR

on:
  push:
    # Tagi v2.* budują osobną aplikację ASOLAR v2 (v2-windows-release.yml).
    tags: ["v*", "!v2.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testy backendu
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Frontend — testy i build produkcyjny
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Aplikacja desktopowa — testy i build .exe
        working-directory: desktop
        run: |
          npm ci
          npm test
          npx electron-builder --win nsis portable --publish never

      - name: Artefakt przebiegu
        uses: actions/upload-artifact@v4
        with:
          name: ASOLAR-windows
          path: desktop/dist/*.exe
          retention-days: 14

      - name: GitHub Release z plikami .exe
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="Aplikacja desktopowa ASOLAR ESET Tracker Manager ${tag}.

          - ASOLAR-*-instalator.exe — instalator (skróty na pulpicie i w menu Start)
          - ASOLAR-*-portable.exe — wersja przenośna bez instalacji

          Tryb serwera na komputerze kierownika wymaga Pythona 3.11 (py -3.11). Pliki nie są podpisane cyfrowo — Windows SmartScreen może pokazać ostrzeżenie „Nieznany wydawca” (Więcej informacji → Uruchom mimo to)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" desktop/dist/*.exe --clobber
          else
            gh release create "$tag" desktop/dist/*.exe --title "ASOLAR ${tag}" --notes "$notes"
          fi
